# Односторонняя выгрузка в Yandex Cloud Object Storage (S3 API) установочного
# комплекта XPowerSpirit-OpenWRT: latest.zip и bootstrap-установщика.
#
# Направление только GitHub -> Object Storage. Обратной синхронизации и скачивания
# из workflow нет: он собирает архив текущего коммита и загружает его в бакет.
# Запуск: по push в main и вручную (workflow_dispatch).
#
# В архив попадают только файлы, нужные для установки на роутер (полный список —
# в шаге «Собрать архив»): установщик, settings.default.json, генератор конфига,
# парсер подписки, update-*.sh, вспомогательные setup/diagnose-скрипты, README.md
# и update-scripts.sh.
#
# Что нужно настроить один раз (Settings -> Secrets and variables -> Actions):
#   секрет YC_S3_KEY_ID — Key ID статического ключа сервисного аккаунта
#   секрет YC_S3_SECRET — Secret статического ключа
#
# Сервисный аккаунт: github-uploader, роль storage.uploader (только запись).
#
# Куда пишем: s3://xpower/OpenWRT/
#   install.sh / install.sh.sha256   — установка с нуля: curl .../install.sh | sh -s -- --sub=...
#   latest.zip                       — источник автообновления роутеров
#   latest.zip.sha256                — хеш latest.zip; роутер сравнивает его с установленным
# latest.zip собирается детерминированно (фиксированные префикс/MANIFEST/TZ), поэтому
# sha256 меняется только при изменении содержимого коммита: роутеры
# не переустанавливают скрипты без причины.
#
# Каждая выгрузка перезаписывает latest.zip и install.sh. Если в бакете включено
# версионирование, неактуальные версии чистит lifecycle-правило бакета, а не workflow.
# Восстановление: скачать объект через консоль Yandex Cloud или aws-cli и распаковать.

name: Backup to Yandex Cloud

on:
  push:
    # latest.zip должен совпадать с main, иначе роутер после установки с raw.githubusercontent
    # откатился бы на предыдущий коммит.
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только собрать архив, без выгрузки"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yandex-cloud-backup
  cancel-in-progress: false

env:
  BUCKET: xpower
  # Префикс объекта внутри бакета. Должен совпадать с URL в settings.default.json,
  # update-scripts.sh и install.sh — иначе роутер не найдёт обновления.
  OBJECT_PREFIX: OpenWRT
  ENDPOINT: https://storage.yandexcloud.net
  AWS_DEFAULT_REGION: ru-central1

jobs:
  backup:
    name: Установочные файлы -> Object Storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Проверить настройку секретов
        if: ${{ inputs.dry_run != true }}
        env:
          YC_S3_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          YC_S3_SECRET: ${{ secrets.YC_S3_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${YC_S3_KEY_ID:-}" ] || [ -z "${YC_S3_SECRET:-}" ]; then
            echo "::error::Нужны секреты YC_S3_KEY_ID и YC_S3_SECRET."
            echo "::error::Добавьте их в Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Секреты найдены."

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Собрать архив
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          mkdir -p dist

          # Белый список файлов, которые нужны на роутере. Менять состав архива нужно
          # только здесь: отсутствующий в HEAD путь — ошибка git archive, поэтому
          # список не устареет молча после переименования скрипта.
          ROUTER_FILES=(
            install-openwrt-xray.sh        # установщик: скачивает остальное на роутер
            settings.default.json          # значения по умолчанию для /etc/xray/settings.json
            xray-generate-config.py        # сборка /etc/xray/config.json
            xray-sub-parser.py             # разбор подписки
            update-xray.sh                 # обновление бинарника, geo-файлов и конфига
            update_nft.py                  # пересборка правил nftables
            xray_settings.py               # общие данные настроек
            setup-wifi-network.sh          # настройка Wi-Fi, запускается отдельно
            setup-led-status.sh            # индикатор состояния, запускается отдельно
            diagnose-xray-tproxy.sh        # диагностика, запускается отдельно
            README.md                      # описание проекта и инструкции по установке
            update-scripts.sh              # самообновление скриптов из latest.zip
            xray-common.sh                 # общие функции: settings.json, архитектура, ротация
            xpower-client                  # CLI управления Xray TProxy (/usr/bin/xpower-client)
          )

          # latest.zip для автообновления роутеров: фиксированные префикс и TZ=UTC,
          # поэтому sha256 зависит только от содержимого коммита.
          (
            export TZ=UTC
            git archive --format=zip --prefix="${REPO_NAME}/" -o dist/latest.zip HEAD -- "${ROUTER_FILES[@]}"
          )

          # Список содержимого берём из готового архива, чтобы MANIFEST не расходился с ним.
          ARCHIVED=$(unzip -Z1 dist/latest.zip | sed "s|^${REPO_NAME}/||" | grep -v '/$' | LC_ALL=C sort)
          ARCHIVED_COUNT=$(printf '%s\n' "$ARCHIVED" | grep -c . || true)

          # MANIFEST содержит только стабильные поля: дата сборки и номер запуска сделали бы
          # sha256 latest.zip новым при каждом запуске workflow.
          cat > "dist/MANIFEST.txt" <<EOF
          repository: ${GITHUB_REPOSITORY}
          ref: ${GITHUB_REF}
          commit: $(git rev-parse HEAD)
          commit_date: $(TZ=UTC git log -1 --format=%cI HEAD)
          files: ${ARCHIVED_COUNT}
          contents: файлы для установки на роутер

          ${ARCHIVED}
          EOF
          # mtime манифеста = время коммита: иначе запись в zip получает текущее время
          touch -d "@$(git log -1 --format=%ct HEAD)" dist/MANIFEST.txt
          zip -q -X -j dist/latest.zip dist/MANIFEST.txt
          rm -f dist/MANIFEST.txt
          (cd dist && sha256sum latest.zip > latest.zip.sha256)

          # Bootstrap-установщик публикуется отдельным объектом: его скачивают до того,
          # как на роутере что-либо установлено. В архив он не входит — он сам
          # скачивает latest.zip.
          sha256sum install.sh > dist/install.sh.sha256

          echo "Содержимое архива:"
          unzip -Z1 dist/latest.zip
          echo "sha256 latest.zip: $(cut -d' ' -f1 dist/latest.zip.sha256)"

          echo "ARCHIVE_FILES=${ARCHIVED_COUNT}" >> "$GITHUB_ENV"
          ls -lh dist/latest.zip

      - name: Выгрузить в Object Storage
        if: ${{ inputs.dry_run != true }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
        run: |
          set -euo pipefail

          # aws s3 cp возвращает ненулевой код при любой ошибке сети или авторизации,
          # поэтому отдельная проверка размера не нужна: сервисному аккаунту
          # намеренно не выдано право чтения объектов (storage.uploader).
          aws s3 cp dist/latest.zip "s3://${BUCKET}/${OBJECT_PREFIX}/latest.zip" \
            --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp dist/latest.zip.sha256 "s3://${BUCKET}/${OBJECT_PREFIX}/latest.zip.sha256" \
            --endpoint-url "$ENDPOINT" --only-show-errors

          # Установка с нуля: curl .../install.sh | sh -s -- --sub=...
          aws s3 cp install.sh "s3://${BUCKET}/${OBJECT_PREFIX}/install.sh" \
            --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp dist/install.sh.sha256 "s3://${BUCKET}/${OBJECT_PREFIX}/install.sh.sha256" \
            --endpoint-url "$ENDPOINT" --only-show-errors

          echo "UPLOADED_LATEST=${OBJECT_PREFIX}/latest.zip" >> "$GITHUB_ENV"

      - name: Итог
        if: ${{ always() }}
        run: |
          {
            echo "### Выгрузка в Yandex Cloud Object Storage"
            echo ""
            echo "- файлов: ${ARCHIVE_FILES:-—} (только установочные для роутера)"
            echo "- latest: \`s3://${BUCKET}/${UPLOADED_LATEST:-не выгружался}\`"
            echo "- sha256 latest: \`$(cut -d' ' -f1 dist/latest.zip.sha256 2>/dev/null || echo '—')\`"
            echo "- выгрузка: ${{ inputs.dry_run && 'не выполнялась (dry-run)' || 'выполнена или прервана — см. лог шага выше' }}"
          } >> "$GITHUB_STEP_SUMMARY"
